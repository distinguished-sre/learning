# _data/course.yml: единственный источник порядка уроков. prev/next вычисляет layout.
# time темы = сумма time её уроков. layer и project выводятся на главной курса.
topics:
  - n: 1
    dir: 01-linux
    title: "Linux для нагрузочника"
    subtitle: "Терминал, логи, ресурсы машины, сеть и скрипты: всё, чем смотрят на сервер под нагрузкой"
    time: "12 ч"
    layer: "Ubuntu · терминал"
    project: "Готовим рабочее место и учимся видеть, чем занята машина"
    lessons:
      - id: "1.1"
        slug: 01-workstation-terminal
        title: "Рабочее место: Ubuntu, терминал, файлы и справка"
        time: "2 ч"
      - id: "1.2"
        slug: 02-text-logs
        title: "Текст и логи: less, grep, конвейеры, awk"
        time: "2 ч"
      - id: "1.3"
        slug: 03-processes-resources
        title: "Процессы и ресурсы: CPU, память, диск, load average"
        time: "2.5 ч"
      - id: "1.4"
        slug: 04-network-cli
        title: "Сеть из терминала: TCP/IP, порты, ping, ss, dig, curl"
        time: "3 ч"
      - id: "1.5"
        slug: 05-bash-scripts
        title: "Bash-скрипты: переменные, условия, циклы"
        time: "2.5 ч"
  - n: 2
