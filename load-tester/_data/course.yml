        slug: 01-client-server-http
        title: "Клиент, сервер и HTTP: запрос, ответ, коды"
        time: "2.5 ч"
      - id: "2.2"
        slug: 02-rest-json-auth
        title: "REST API, JSON и авторизация"
        time: "2 ч"
      - id: "2.3"
