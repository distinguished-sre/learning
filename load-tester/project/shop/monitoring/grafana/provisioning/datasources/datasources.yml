apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Из строки лога shop достаём trace_id и даём ссылку на трейс в Tempo.
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '"trace_id":\s*"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: Открыть трейс
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Обратная связь: от спана к логам shop с тем же trace_id.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: true
        query: '{service="shop"} |= "$${__trace.traceId}"'
      nodeGraph:
        enabled: true
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
