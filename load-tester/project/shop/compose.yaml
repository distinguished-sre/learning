name: shop

services:
  shop:
    restart: unless-stopped
    build: ./shop
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://shop:shop@postgres:5432/shop}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PAYMENT_URL: ${PAYMENT_URL:-http://payment:8001}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CACHE_ENABLED: ${CACHE_ENABLED:-0}
      CACHE_TTL: ${CACHE_TTL:-60}
      BUG_N_PLUS_ONE: ${BUG_N_PLUS_ONE:-1}
      LEAK_ENABLED: ${LEAK_ENABLED:-0}
      PAYMENT_TIMEOUT: ${PAYMENT_TIMEOUT:-10}
      PAYMENT_RETRIES: ${PAYMENT_RETRIES:-3}
      SESSION_TTL: ${SESSION_TTL:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/tmp/shop-metrics}
      TRACING_ENABLED: ${TRACING_ENABLED:-1}
      OTEL_SERVICE_NAME: shop
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_EXPORTER_OTLP_TIMEOUT: "3"
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    ports: ["${BIND_ADDR:-127.0.0.1}:8000:8000"]
    cpus: "1.0"
    mem_limit: 512m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      payment: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  payment:
    restart: unless-stopped
    build: ./payment
    environment:
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-50}
      PAYMENT_FAIL_RATE: ${PAYMENT_FAIL_RATE:-0.0}
      TRACING_ENABLED: ${TRACING_ENABLED:-1}
      OTEL_SERVICE_NAME: payment
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_EXPORTER_OTLP_TIMEOUT: "3"
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    ports: ["${BIND_ADDR:-127.0.0.1}:8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    restart: unless-stopped
    image: postgres:18.6
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200
      - -c
      - max_connections=100
    cpus: "1.0"
    mem_limit: 1g
    volumes:
      # PostgreSQL 18 хранит данные в /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP недоступен у временного сервера инициализации: seed должен закончиться.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  redis:
    restart: unless-stopped
    image: redis:8.10.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-remote-write-receiver"]
    ports: ["${BIND_ADDR:-127.0.0.1}:9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    depends_on:
      shop: {condition: service_healthy}
      payment: {condition: service_healthy}

  alertmanager:
    restart: unless-stopped
    image: prom/alertmanager:v0.34.1
    profiles: [monitoring]
    ports: ["${BIND_ADDR:-127.0.0.1}:9093:9093"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      # Admin без пароля: безопасно только пока порт привязан к 127.0.0.1 (BIND_ADDR).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports: ["${BIND_ADDR:-127.0.0.1}:3000:3000"]
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    restart: unless-stopped
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    pid: host
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]

  cadvisor:
    restart: unless-stopped
    # Начиная с v0.53.0 официальный образ публикуется в GHCR.
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [monitoring]
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=5s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  postgres-exporter:
    restart: unless-stopped
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    environment:
      DATA_SOURCE_NAME: postgresql://shop:shop@postgres:5432/shop?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  loki:
    restart: unless-stopped
    image: grafana/loki:3.7.8
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["${BIND_ADDR:-127.0.0.1}:3100:3100"]
    volumes: ["loki:/loki"]

  tempo:
    restart: unless-stopped
    image: grafana/tempo:2.10.8
    profiles: [monitoring]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports: ["${BIND_ADDR:-127.0.0.1}:3200:3200"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo:/var/tempo

  alloy:
    restart: unless-stopped
    image: grafana/alloy:v1.20.1
    profiles: [monitoring]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    # OTLP/HTTP от shop и payment (порт 4318) доступен внутри сети Compose.
    ports: ["${BIND_ADDR:-127.0.0.1}:12345:12345"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki, tempo]

volumes:
  pgdata:
  prometheus:
  grafana:
  loki:
  tempo:
