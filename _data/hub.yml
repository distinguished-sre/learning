# Тексты главной сайта. Пишет редактор, выводит _layouts/hub.html. Ключи не переименовывать.
# href относительный без baseurl (например /devops/), layout добавляет relative_url.
# Цифры курсов (темы, уроки, часы) здесь не пишем: их считает layout из _data/courses/*.yml.
#
# Форма элементов списков:
#   hero.facts[]        строка
#   audience.items[]    { title, text, start: { text, href } }
#   courses.items[]     { key, name, tagline, text, for_whom, outcomes[] (строки), start_hint }
#   route.items[]       { title, text }
#   lesson.items[]      { title, text }
#   lesson.sample       { title, href, link_text, steps[] { label, text, code } } фрагмент настоящего урока, дословно, можно сокращать
#   faq.items[]         { q, a }
hero:
  eyebrow: "Бесплатные курсы Евгения Быкова"
  title: "Научись держать сервисы на ногах"
  lead: "Три курса на русском: DevOps, нагрузочное тестирование, мониторинг и SRE. Для тех, кто начинает с нуля или идёт в эксплуатацию из тестирования и разработки. Вся практика на учебных стендах у тебя на компьютере."
  cta_primary: { text: "Выбрать курс", href: "#courses" }
  cta_secondary: { text: "Как устроен урок", href: "#lesson" }
  facts:
    - "Бесплатно, без регистрации и рекламы"
    - "Практика на своём стенде: «Заметки» и «Магазин»"
    - "Тест «Проверь себя» и вопросы с собеседований"
    - "Схемы и анимации, где без них не понять"
audience:
  title: "Для кого"
  lead: "Выбери свою ситуацию: от неё зависит, с какого курса начать."
  items:
    - title: "Не работал в IT и хочу в эксплуатацию"
      text: "Умеешь пользоваться компьютером, остального нет. Курс DevOps начинается с первого сервера и терминала. К финалу у тебя сервис в Kubernetes, графики его работы и дежурство: сигнал о поломке приходит тебе, и ты чинишь."
      start: { text: "Начни с DevOps, урок 1.1", href: "/devops/01-linux/01-first-server-shell.html" }
    - title: "Тестировщик или новичок, хочу в нагрузку"
      text: "Ручное тестирование, поддержка или просто интерес к тому, почему сайты падают в распродажу. Курс нагрузочного тестирования даёт Linux, Python и Docker ровно в нужном объёме, потом Locust, k6 и поиск узких мест."
      start: { text: "Начни с нагрузочного тестирования, урок 1.1", href: "/load-tester/01-linux/01-workstation-terminal.html" }
    - title: "Разработчик или админ, нужны мониторинг и дежурства"
      text: "Терминал, curl и docker compose уже знаешь, а на вопрос «что сейчас с сервисом?» отвечаешь не сразу. Курс мониторинга и SRE короткий: метрики, логи, трейсы, SLO, алерты, инцидент и постмортем."
      start: { text: "Начни с мониторинга, урок 1.1", href: "/monitoring/01-basics/01-signals.html" }
    - title: "Готовлюсь к собеседованию"
      text: "В каждом курсе есть страница «Подготовка к собеседованию»: устные вопросы с разбором и тесты по темам. В финалах DevOps и нагрузочного тестирования пробные собеседования: junior и middle, инженер по нагрузке, инженер мониторинга. Идёшь на middle: начни с них, а потом закрой темы, где ответы вышли слабее."
      start: { text: "DevOps", href: "/devops/interview.html" }
      start2: { text: "Нагрузка", href: "/load-tester/interview.html" }
      start3: { text: "Мониторинг", href: "/monitoring/interview.html" }
courses:
  title: "Курсы"
  lead: "Два больших курса с нуля и короткий курс о мониторинге, общий для обоих."
  items:
    - key: devops
      name: "DevOps"
      tagline: "От первого сервера до Kubernetes и дежурства"
      text: "Один сервис, «Заметки», проходит путь от сервера и nginx до Kubernetes, Terraform и алертов. В конце у тебя репозиторий проекта: README, схема, документ решений и проверки в CI."
      for_whom: "Если не работал в IT или знаешь только кусочки и хочешь в DevOps или SRE."
      outcomes_title: "Что получится"
      outcomes:
        - "поднять сервер, опубликовать сервис за nginx с HTTPS и разобрать, почему «сайт не открывается»"
        - "запустить сервис в Kubernetes с обновлением без простоя и разобрать типовые поломки"
        - "описать инфраструктуру в Terraform и Ansible, а деплой отдать Flux"
        - "отдежурить по алертам, написать постмортем и пройти мок-собеседование на junior и middle"
      start_hint: "С нуля: урок 1.1. Уже работаешь с Linux и сетью: пролистай темы 1 и 2 по чек-листу «Итог урока: ты умеешь» и начинай с темы 3 (Git и CI) или 4 (Docker)."
    - key: load-tester
      name: "Нагрузочное тестирование"
      tagline: "Найди предел сервиса и докажи его цифрами"
      text: "Нагружаешь учебный магазин и ищешь, во что он упирается: процессор, база, пул соединений или память. Вывод доказываешь метриками, логами и трейсами."
      for_whom: "Новичку и тестировщику, который хочет в нагрузочное тестирование или мониторинг."
      outcomes_title: "Что получится"
      outcomes:
        - "написать сценарий покупателя в Locust и k6 и запустить нагрузку с нужным профилем и порогами"
        - "прочитать результат по метрикам, логам и трейсам и показать узкое место"
        - "написать отчёт, который читают, и поставить нагрузочный smoke в CI"
      start_hint: "С нуля: урок 1.1. Уже знаешь Linux, Python или мониторинг: пролистай темы 1–6 по итогам уроков и начинай с темы 7 (метрики, логи, трейсы) или 8 (теория нагрузки)."
    - key: monitoring
      name: "Мониторинг и SRE"
      tagline: "Узнай о сбое раньше пользователей"
      text: "Короткий курс, общий для двух других. Учебный «Магазин» стоит у тебя на компьютере, и ты учишься отвечать, что с ним сейчас: SLO, Prometheus, Grafana, алерты, а в конце инцидент и постмортем."
      for_whom: "Если терминал и docker compose знаешь, а что с сервисом, сказать не можешь."
      outcomes_title: "Что получится"
      outcomes:
        - "посчитать доступность и задержку, договориться об SLI, SLO и бюджете ошибок"
        - "поднять Prometheus, написать запросы RED и USE, собрать дашборды и алерты с runbook"
        - "найти причину по логам и трейсам, провести учебный инцидент и написать постмортем"
      start_hint: "Нужны терминал, curl и docker compose: если их нет, сначала темы 1 и 5 курса нагрузочного тестирования или 1 и 4 курса DevOps. Дальше с урока 1.1."
route:
  title: "Как курсы связаны"
  lead: "С нуля начинай с DevOps или нагрузочного тестирования: они независимы, бери любой или проходи только один. Мониторингу нужны терминал и docker compose, их дают первые темы любого из двух курсов. Потом мониторинг становится общей базой: без метрик и логов непонятно ни как живёт сервис, ни что показал нагрузочный тест."
  items:
    - title: "Один стенд на два курса"
      text: "Мониторинг и нагрузочное тестирование работают на одном учебном «Магазине»: в нём уже есть Prometheus, Grafana, Alertmanager, Loki и Tempo. Поднял один раз, пользуешься в обоих курсах."
    - title: "Наблюдаемость есть в каждом курсе"
      text: "Основы в курсе мониторинга. Прикладное там, где нужно: тема 8 DevOps ставит мониторинг «Заметкам» в Kubernetes, тема 7 нагрузочного тестирования читает приборы под нагрузкой и разбирает первый инцидент."
    - title: "Linux, Git и Docker повторяются"
      text: "Оба больших курса начинают с терминала, Git и Docker. Прошёл их в одном курсе: в другом пролистай эти темы по итогам уроков и иди дальше."
    - title: "Дежурство и собеседования в финале"
      text: "DevOps заканчивается дежурством по алертам, постмортемом и двумя мок-собеседованиями. Нагрузочное тестирование: инцидентом под нагрузкой, тестовым заданием и пробными собеседованиями на нагрузочника и инженера мониторинга."
lesson:
  title: "Как устроен урок"
  lead: "Уроки собраны по одному шаблону: сначала зачем, потом как устроено, потом руками."
  sample:
    kick: "Так выглядит урок"
    title: "«Сломай и почини»: лампочки зелёные, а оплата не проходит"
    href: "/monitoring/01-basics/01-signals.html#сломай-и-почини"
    link_text: "Открыть урок целиком"
    steps:
      - label: "Симптом"
        text: "Оплата отвечает отказом в семи случаях из десяти, а `/healthz` магазина отдаёт 200, процессор и память в норме."
      - label: "Проверка"
        text: "Посмотри на ту же поломку тремя сигналами. Начни с метрики:"
        code: |-
          curl -s localhost:8000/metrics | grep -E '^http_requests_total.*orders|^shop_payment_requests_total'
      - label: "Что получится"
        code: |-
          http_requests_total{method="POST",route="/api/orders",status="201"} 8.0
          http_requests_total{method="POST",route="/api/orders",status="502"} 2.0
          shop_payment_requests_total{result="ok"} 8.0
          shop_payment_requests_total{result="error"} 18.0
      - label: "Как читать вывод"
        text: "Серия `502` на `/api/orders` растёт, у оплаты попыток `error` больше, чем `ok` (магазин повторяет попытки: одна ошибка заказа это до четырёх неудачных попыток)."
  items:
    - title: "Зачем и картина целиком"
      text: "Урок начинается с рабочей задачи, которую решает тема. Схема показывает, как части связаны, и только потом идёт теория."
    - title: "Теория и практика"
      text: "Каждое новое слово объясняется там, где встретилось. Теории около половины урока, остальное руками: команды, ожидаемый вывод и разбор. «Заметки» в DevOps, «Магазин» в нагрузочном тестировании и мониторинге поднимаются у тебя на компьютере."
    - title: "Сломай и почини"
      text: "В большинстве уроков есть намеренная поломка: симптом, гипотезы, проверки, исправление. Так учатся искать причину, а не лечить симптом."
    - title: "Вопросы с собеседований и тест"
      text: "Вопросы уровня junior и middle: что хотят услышать и какой ответ насторожит. В конце тест «Проверь себя», каждая попытка берёт вопросы из банка заново."
faq:
  title: "Частые вопросы"
  items:
    - q: "Сколько это стоит?"
      a: "Бесплатно. Курсы открыты целиком, без регистрации и рекламы. Исходники лежат на GitHub."
    - q: "Я уже работаю в IT. Что мне здесь взять?"
      a: "Основной объём рассчитан на старт с нуля, поэтому азы пролистай по чек-листам «Итог урока: ты умеешь». Тебе пригодятся разборы «Сломай и почини», вопросы уровня middle в уроках и финал DevOps: учебное дежурство по алертам, постмортем и runbook, бэкапы и восстановление, кирпичики распределённых систем, ревью безопасности и пробное собеседование на middle. В нагрузочном курсе темы 1–6 пролистай по итогам уроков и начни с 7 (метрики, логи, трейсы) или 8 (теория нагрузки). Мониторинг короткий: если терминал и docker compose знаешь, проходи его целиком."
    - q: "Нужен ли опыт в IT?"
      a: "Нет. DevOps и нагрузочное тестирование начинаются с терминала и объясняют каждое слово. Мониторингу нужны терминал, curl и docker compose: их дают первые темы любого из двух курсов."
    - q: "Что нужно на компьютере?"
      a: "Windows, Mac или Linux с 8 ГБ памяти, лучше 16, и место на диске: нагрузочному курсу нужно около 40 ГБ. Практика идёт в Ubuntu, на Windows и Mac она ставится по шагам в первом уроке. Для Git и CI нужен аккаунт на GitHub, для облачных тем DevOps хватит пробного гранта Yandex Cloud."
    - q: "Сколько времени займёт?"
      a: "Урок рассчитан на одно-два занятия по полтора-два часа. Часы по темам есть на главной каждого курса, у DevOps и нагрузочного тестирования там же калькулятор: задаёшь свой темп и видишь, когда закончишь."
    - q: "Где хранится прогресс?"
      a: "В браузере, на твоём компьютере: отметки пройденных уроков и попытки тестов. Регистрации нет, поэтому в другом браузере или после очистки данных сайта прогресс начнётся заново."
    - q: "Можно ли проходить с телефона?"
      a: "Читать уроки и проходить тесты можно, сайт подстраивается под экран. Практика идёт в терминале и Docker, для неё нужен компьютер."
    - q: "Будет ли сертификат или проверка заданий?"
      a: "Нет. Живого проверяющего и сертификата нет. В каждом уроке есть ожидаемый вывод и разбор типичных ошибок, а в разделе «ИИ в помощь» готовые запросы к нейросети. Подтверждение навыков: твой репозиторий с проектом курса."
author:
  title: "Автор"
  text: "Курсы написал Евгений Быков. Исходники открыты на GitHub. Нашёл ошибку в уроке или команду, которая не работает: [напиши в задачи репозитория](https://github.com/distinguished-sre/learning/issues/new)."
