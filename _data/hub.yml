# Тексты главной сайта. Пишет редактор, выводит _layouts/hub.html. Ключи не переименовывать.
# href относительный без baseurl (например /devops/), layout добавляет relative_url.
# Цифры курсов (темы, уроки, часы) здесь не пишем: их считает layout из _data/courses/*.yml.
#
# Markdown (markdownify) работает только в sample.steps[].text, faq.items[].a и author.text; в остальных полях `код` и *звёздочки* выведутся как есть.
# Форма элементов списков:
#   hero.facts[]        строка
#   audience.items[]    { title, text, start: { text, href } }
#   courses.items[]     { key, name, tagline, text, for_whom, outcomes[] (строки), start_hint }
#   route.items[]       { title, text }
#   lesson.items[]      { title, text }
#   lesson.sample       { title, href, link_text, steps[] { label, text, code } } фрагмент настоящего урока, дословно, можно сокращать
#   faq.items[]         { q, a }
hero:
  eyebrow: "Бесплатные курсы Евгения Быкова"
  title: "Курсы по DevOps, нагрузочному тестированию и мониторингу"
  lead: "Три курса на русском. DevOps: выкладывать сервисы и следить, чтобы они работали. Нагрузочное тестирование: проверять, сколько посетителей сервис выдержит. Мониторинг и SRE (инженерия надёжности сервисов): узнавать о сбое раньше пользователей. Подходят тем, кто начинает с нуля. Практика идёт на твоём компьютере. Цель: уровень junior, который можно показать репозиторием."
  cta_primary: { text: "Выбрать курс", href: "#courses" }
  cta_secondary: { text: "Как устроен урок", href: "#lesson" }
  facts:
    - "Сайт бесплатный, читать его можно без регистрации"
    - "Читать можно с телефона, практика на компьютере"
    - "Практика на учебных приложениях: «Заметки» (веб-сервис для заметок) и «Магазин» (учебный интернет-магазин)"
    - "Тест «Проверь себя» и вопросы с собеседований"
    - "Отмечаешь пройденные уроки, а на карточке курса видно, сколько прошёл (счётчик появляется после первого пройденного урока)"
    - "Схемы и анимации, где без них не понять"
audience:
  title: "Для кого"
  lead: "Выбери свою ситуацию: от неё зависит, с какого курса начать. Курсы готовят к начальным позициям: junior DevOps, инженер по нагрузке, инженер мониторинга. Что курс даёт для поиска работы, читай в <a href=\"#faq\">частых вопросах</a>. Терминал: окно, где команды вводят текстом."
  items:
    - title: "Не работал в IT, хочу в DevOps"
      text: "Умеешь пользоваться компьютером, остального нет. Курс DevOps начинается с первого сервера (обычного компьютера без экрана, который раздаёт сайты другим) и терминала. К финалу у тебя работающий сервис в Kubernetes (системе, которая сама перезапускает упавшие программы), графики его работы и дежурство: тебе приходит сигнал о поломке, и ты чинишь."
      start: { text: "Начни с DevOps, урок 1.1", href: "/devops/01-linux/01-first-server-shell.html" }
    - title: "Тестировщик или новичок, хочу в нагрузку"
      text: "Ручное тестирование, поддержка или просто интерес к тому, почему сайты падают в распродажу. Курс нагрузочного тестирования даёт Linux, Python и Docker ровно в нужном объёме, потом сценарии покупателей (Locust, k6) и поиск места, где сервис упирается в предел."
      start: { text: "Начни с нагрузочного тестирования, урок 1.1", href: "/load-tester/01-linux/01-workstation-terminal.html" }
    - title: "Разработчик или админ, нужны мониторинг и дежурства"
      text: "Умеешь запускать программы командами, а на вопрос «что сейчас с сервисом?» отвечаешь не сразу. Курс мониторинга и SRE: метрики (показания сервиса), логи (журнал событий), трейсы (путь запроса по сервису), SLO (договорённость о допустимом простое), алерты (тревоги при сбое), инцидент (сбой, который чинят) и постмортем (письменный разбор сбоя)."
      start: { text: "Начни с мониторинга, урок 1.1", href: "/monitoring/01-basics/01-signals.html" }
    - title: "Работаю в смежной сфере и хочу в IT"
      text: "Поддержка, охрана, логистика, администрирование: следить за системой и реагировать на сбои ты уже умеешь, здесь это про сайты и серверы. Охрана видит камеры и тревоги, в мониторинге то же самое для сайта: графики и оповещения. Первые темы DevOps нужны ради терминала, потом сразу мониторинг."
      start: { text: "Начни с DevOps, урок 1.1", href: "/devops/01-linux/01-first-server-shell.html" }
    - title: "Готовлюсь к собеседованию"
      text: "В каждом курсе есть страница с устными вопросами и тестами. Опыта нет: иди по урокам, пробные собеседования ждут в финале."
      start: { text: "DevOps", href: "/devops/interview.html" }
      start2: { text: "Нагрузка", href: "/load-tester/interview.html" }
      start3: { text: "Мониторинг", href: "/monitoring/interview.html" }
courses:
  title: "Курсы"
  lead: "Два больших курса с нуля и курс поменьше о мониторинге, который идёт после первых тем любого из них."
  items:
    - key: devops
      name: "DevOps"
      tagline: "От первого сервера до Kubernetes и дежурства"
      text: "Один сервис, «Заметки» (веб-сервис для заметок), проходит путь от сервера и nginx до Kubernetes, Terraform и алертов. В конце у тебя репозиторий проекта: README, схема, документ решений и проверки в CI."
      for_whom: "Если не работал в IT или знаешь только кусочки и хочешь в DevOps или SRE."
      outcomes_title: "Что получится"
      outcomes:
        - "поднять сервер, опубликовать сервис за nginx с HTTPS (защищённым соединением) и разобрать, почему «сайт не открывается»"
        - "запустить сервис в Kubernetes с обновлением без простоя и разобрать типовые поломки"
        - "описать серверы файлами, а не вручную, и выкладывать новые версии автоматически"
        - "отдежурить смену (тебе приходят тревоги, алерты), письменно разобрать поломку, чтобы она не повторилась (постмортем), и пройти пробное собеседование на начальную и среднюю позицию (junior, middle)"
      start_hint: "С нуля: урок 1.1. Если cd, ls и ssh для тебя привычны и IP-адрес знаком, пропусти первые две темы и начни с Git. Чек-лист «Итог урока: ты умеешь» в конце уроков тем 1 и 2 покажет, всё ли там уже знакомо."
    - key: load-tester
      name: "Нагрузочное тестирование"
      tagline: "Как узнать, сколько посетителей выдержит сервис"
      text: "Нагружаешь учебный магазин и ищешь, во что он упирается: процессор, память, база данных или ограниченное число подключений к ней. Вывод доказываешь метриками, логами и трейсами."
      for_whom: "Новичку и тестировщику, который хочет в нагрузочное тестирование или мониторинг."
      outcomes_title: "Что получится"
      outcomes:
        - "описать путь покупателя (зашёл, выбрал, оплатил) и пустить на магазин много таких виртуальных покупателей"
        - "задать, сколько ожидания и ошибок допустимо, иначе тест считается проваленным"
        - "прочитать результат по метрикам, логам и трейсам и показать узкое место"
        - "написать отчёт, который читают, и поставить в CI (автоматические проверки кода) короткий нагрузочный тест smoke"
      start_hint: "С нуля: урок 1.1. Уже уверенно работаешь с Linux, Python, Docker и Git: пролистай эти темы по итогам уроков и начинай с метрик, логов и трейсов или с теории нагрузки. Если знаешь только часть, пролистай именно её темы."
    - key: monitoring
      name: "Мониторинг и SRE"
      tagline: "Графики, тревоги, дежурство и разбор сбоев"
      text: "Мониторинг это постоянное наблюдение за сервисом: графики и оповещения, чтобы узнать о поломке раньше пользователей. Учебный «Магазин» стоит у тебя на компьютере, и ты учишься отвечать, что с ним сейчас, а в конце проводишь инцидент и пишешь постмортем. Ты видишь, жив ли сервис и что с ним, без захода на сервер."
      for_whom: "Если умеешь запускать программы командами, а что с сервисом, сказать не можешь."
      outcomes_title: "Что получится"
      outcomes:
        - "договориться, сколько простоя допустимо (цель SLO, например 99,9% времени работы), как это измерять (SLI) и сколько ошибок можно потратить (бюджет ошибок)"
        - "поднять систему, которая собирает показания сервиса, и нарисовать по ним графики и тревоги"
        - "написать инструкцию дежурному, что делать при тревоге"
        - "найти причину по логам и трейсам, провести учебный инцидент и написать постмортем"
      start_hint: "Нужны терминал, curl и docker compose: если их нет, сначала темы 1, 2 и 5 курса нагрузочного тестирования или темы 1 и 4 курса DevOps. Стенд «Магазин» ты поднимешь в первом уроке мониторинга по шагам. Дальше с урока 1.1."
route:
  title: "Как курсы связаны"
  lead: "С нуля начинай с DevOps или нагрузочного тестирования: они независимы, бери любой или проходи только один. Мониторингу нужны терминал и Docker, их дают первые темы любого из двух курсов, поэтому его удобно взять следом (метрики это показания сервиса, логи это журнал событий)."
  items:
    - title: "Один стенд на два курса"
      text: "Мониторинг и нагрузочное тестирование работают на одном учебном «Магазине»: в нём уже стоит набор приборов: графики (Prometheus, Grafana), тревоги (Alertmanager), журналы (Loki) и следы запросов (Tempo). Поднял один раз, пользуешься в обоих курсах."
    - title: "Наблюдаемость есть в каждом курсе"
      text: "Отдельный курс мониторинга даёт то, чего нет в двух других: SLI, SLO и бюджет ошибок, дежурство, учебный инцидент и постмортем на одном стенде. Прикладное там, где нужно: тема 8 DevOps ставит мониторинг «Заметкам» в Kubernetes, тема 7 нагрузочного тестирования читает приборы под нагрузкой и разбирает первый инцидент."
    - title: "Linux, Git и Docker повторяются"
      text: "Оба больших курса начинают с терминала, Git и Docker. Прошёл их в одном курсе: в другом пролистай эти темы по итогам уроков и иди дальше."
    - title: "Дежурство и собеседования в финале"
      text: "DevOps заканчивается дежурством по алертам, постмортемом и двумя пробными собеседованиями. Нагрузочное тестирование заканчивается инцидентом под нагрузкой, тестовым заданием и пробными собеседованиями на инженера по нагрузке и инженера мониторинга."
lesson:
  title: "Как устроен урок"
  lead: "Уроки собраны по одному шаблону: сначала зачем, потом как устроено, потом руками."
  sample:
    kick: "Так выглядит урок"
    title: "«Сломай и почини»: лампочки зелёные, а оплата не проходит"
    href: "/monitoring/01-basics/01-signals.html#сломай-и-почини"
    link_text: "Открыть урок целиком"
    steps:
      - label: "Симптом"
        text: "Оплата отказывает в семи попытках из десяти, а проверка здоровья `/healthz` (адрес, по которому сервис сообщает «я жив») отвечает 200 («всё в порядке» на языке сайтов), процессор и память в норме."
      - label: "Проверка"
        text: "Стенд «Магазин» уже запущен, поломка включена; полный урок ведёт с нуля. Урок разбирает поломку тремя сигналами, здесь показан первый. Начни с метрик: это счётчики, которые сервис ведёт сам (логи и трейсы в полном уроке). Команда выбирает из них только строки про оплату:"
        code: |-
          curl -s localhost:8000/metrics | grep '^shop_payment_requests_total'
      - label: "Что получится"
        code: |-
          shop_payment_requests_total{result="ok"} 8.0
          shop_payment_requests_total{result="error"} 18.0
      - label: "Как читать вывод"
        text: "Успешных оплат (`ok`) 8, неудачных (`error`) 18: ошибок больше, чем успехов.\n\nВывод: лампочки зелёные, а ломается именно оплата, и это видно уже по счётчикам. Какие заказы и почему, покажут логи и трейс в полном уроке."
  items:
    - title: "Зачем и картина целиком"
      text: "Урок начинается с истории: что сломалось и зачем тебе это знать. Потом схема, потом теория."
    - title: "Теория и практика"
      text: "Каждое новое слово объясняется там, где встретилось. Теории около половины урока, остальное руками: команды, ожидаемый вывод и разбор. «Заметки» в DevOps, «Магазин» в нагрузочном тестировании и мониторинге поднимаются у тебя на компьютере."
    - title: "Сломай и почини"
      text: "В большинстве уроков есть намеренная поломка: симптом, гипотезы, проверки, исправление. Так учатся искать причину, а не лечить симптом."
    - title: "Вопросы с собеседований и тест"
      text: "Вопросы уровня junior и middle: что хотят услышать и какой ответ насторожит. В конце тест «Проверь себя», каждая попытка берёт вопросы из банка заново."
faq:
  title: "Частые вопросы"
  items:
    - q: "Можно ли после этого найти работу?"
      a: "Курс не обещает работу, но готовит к начальным позициям. Вакансий именно «инженер по нагрузке» меньше, чем DevOps: навык часто нужен внутри ролей QA и SRE. Он даёт проект в твоём репозитории, который можно показать, и пробные собеседования с разбором. Опыта на боевых системах он не даёт: его придётся набирать уже на работе. Искать начинай с позиций junior: DevOps-инженер, инженер по нагрузке, инженер мониторинга. В резюме положи ссылку на репозиторий проекта."
    - q: "Сколько это стоит?"
      a: "Бесплатно. Исходники на [GitHub](https://github.com/distinguished-sre/learning)."
    - q: "Я уже работаю в IT. Что мне здесь взять?"
      a: |-
        Основной объём рассчитан на старт с нуля, поэтому азы пролистай по чек-листам «Итог урока: ты умеешь». Тебе пригодятся разборы «Сломай и почини» и вопросы уровня middle в уроках. Идёшь на middle: начни с пробных собеседований в финалах DevOps и нагрузочного курса, потом закрой темы, где ответы вышли слабее. По курсам:

        - DevOps: темы 1 и 2 пролистай, входи с темы 3 (Git и CI) или 4 (Docker). Целиком пройди финал: учебное дежурство по алертам, постмортем и runbook (инструкция дежурному), бэкапы и восстановление, устройство систем из нескольких серверов, ревью безопасности и пробное собеседование на middle.
        - Нагрузочное тестирование: темы 1–6 пролистай, начни с 7 (метрики, логи, трейсы) или 8 (теория нагрузки).
        - Мониторинг: если терминал и docker compose знаешь, проходи его целиком.
    - q: "Нужен ли опыт в IT?"
      a: "Нет. DevOps и нагрузочное тестирование начинаются с терминала и объясняют каждое слово. Мониторингу нужны терминал, curl и docker compose: их дают темы 1, 2 и 5 нагрузочного курса или темы 1 и 4 DevOps."
    - q: "Что нужно на компьютере?"
      a: |-
        Обычный ноутбук с Windows, Mac или Linux, интернет, 8 ГБ памяти и от 25 до 30 ГБ свободного места в зависимости от курса. Облако не обязательно: облачную тему DevOps (6) можно пропустить. Подробности по курсам:

        - DevOps: хватит 8 ГБ. Для Kubernetes на 8 ГБ в уроках есть разделы «Если у тебя 8 ГБ».
        - Нагрузочное тестирование: комфортно с 16 ГБ памяти. На 8 ГБ закрой лишнее: урок 1.1 создаёт виртуальную машину на 8 ГБ, и хосту почти ничего не остаётся. Свободного места около 30 ГБ. Первый урок проверяет, хватит ли машине ресурсов.
        - Мониторинг: около 4 ГБ свободной памяти. Что нужно для стенда «Магазин» (Docker с Compose v2, свободные порты), сказано в уроке 1.1.

        Практика идёт в Ubuntu, на Windows и Mac она ставится по шагам в первом уроке. Для Git и CI (автоматические проверки кода) нужен бесплатный аккаунт на GitHub. Если всё же пойдёшь в облачную тему 6: нужен аккаунт Yandex Cloud, условия пробного гранта меняются, смотри их на сайте облака, а ресурсы удаляй после урока. Облачные задания темы 7 (например, задание 5 урока 7.1) без облака читай как разбор кода и проверяй через `terraform validate`; остальное пройдёт без облака.
    - q: "Можно ли проходить с телефона?"
      a: "Читать уроки и проходить тесты можно, сайт подстраивается под экран. Удобно так: читаешь с телефона после работы, а команды повторяешь за компьютером на выходных. Практика идёт в терминале и Docker (программа, которая запускает приложения в изолированных «коробках»), для неё нужен компьютер. Если компьютера пока нет, читай и проходи тесты, а команды выполни позже, когда он появится."
    - q: "Сколько времени займёт?"
      a: "Урок занимает от полутора до четырёх с половиной часов, обычно два-три. Время указано у каждого урока и темы. Общие часы курса видны на карточке выше: раздели их на часы, которые готов тратить в неделю. Например, при шести часах в неделю получится два-три урока. Часы по темам есть на главной каждого курса, у DevOps и нагрузочного тестирования там же калькулятор: задаёшь свой темп и видишь, когда закончишь."
    - q: "Где хранится прогресс?"
      a: "В браузере, на твоём компьютере: отметки пройденных уроков и попытки тестов. Регистрации нет, поэтому в другом браузере или после очистки данных сайта прогресс начнётся заново."
    - q: "Будет ли сертификат или проверка заданий?"
      a: "Нет. Живого проверяющего и сертификата нет. В каждом уроке есть ожидаемый вывод и разбор типичных ошибок, а в разделе «ИИ в помощь» готовые запросы к нейросети. Подтверждение навыков: твой репозиторий с проектом курса."
    - q: "Чего курс не даёт?"
      a: "Опыта реального прода и дежурств, коммерческих облаков кроме учебного Yandex Cloud и продвинутых тем Kubernetes. Курс даёт базу и практику на учебных стендах, а опыт на боевых системах приходит на работе. Версии программ, на которых проверен урок, смотри в его разделе «Проверено на версиях»."
