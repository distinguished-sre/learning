name: Синтаксис кода в уроках

on:
  push:
    paths:
      - 'load-tester/[0-9][0-9]-*/*.md'
      - 'monitoring/[0-9][0-9]-*/*.md'
      - 'devops/[0-9][0-9]-*/*.md'
      # Уроки devops выключены: check_snippets находит в них 17 ошибок (плейсхолдеры вида <имя> в bash-блоках).
      # Когда уроки исправят, раскомментируй строку ниже и строку devops в шаге проверки.
      # - 'devops/[0-9][0-9]-*/*.md'
      - '_data/courses/*.yml'
      - 'tools/check_snippets.py'
      - 'tools/courses.py'
      - '.github/workflows/snippets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snippets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: bash -n, py_compile и node --check для блоков кода
        run: |
          python tools/check_snippets.py --course load-tester
          python tools/check_snippets.py --course monitoring
          python tools/check_snippets.py --course devops
