# Единый сайт курсов: GitHub Pages проекта https://distinguished-sre.github.io/learning/
# Курсы лежат в папках devops/, load-tester/ (позже monitoring/). Данные курса: _data/courses/<курс>.yml,
# курс страницы задаётся в defaults ниже (page.course).
title: Обучение
description: "Три курса Евгения Быкова: DevOps, нагрузочное тестирование и мониторинг. Теория простым языком, вопросы с ответами и практика"
email: jenyabykov322@yandex.ru
github_username: distinguished-sre
lang: ru
url: "https://distinguished-sre.github.io"
baseurl: "/learning"
repo_url: "https://github.com/distinguished-sre/learning"
logo: /assets/favicon.svg

# Тему cayman убрали: оформление своё (_layouts, assets/css/style.scss).
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: text
    guess_lang: false

# Все плагины из белого списка GitHub Pages.
plugins:
  - jekyll-relative-links
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

# Ссылки [текст](03-file.md) в уроках превращаются в .html
relative_links:
  enabled: true
  collections: false

# Указав exclude, мы заменяем стандартный список Jekyll целиком, поэтому
# служебные пути перечислены. CLAUDE.md намеренно содержит Liquid-теги как
# текст и не должен попадать на сайт. project/ и _samples/: это код, а не страницы.
# README.md исключён: на сайт идёт index.md (в devops/ это бывший README.md).
exclude:
  - README.md
  - CLAUDE.md
  - project/
  - _samples/
  - tools/
  - "*.sh"
  - "**/README.md"
  - "**/CLAUDE.md"
  - "**/project"
  - "**/tools"
  - "**/*.sh"
  - Makefile
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache
  - .jekyll-cache

# Уроки получают layout lesson и course по scope пути, обзоры тем задают topic явно,
# главные страницы курсов (index.md) задают layout home-<курс> сами.
defaults:
  - scope: {path: "devops"}
    values: {course: devops, image: /devops/devops-thumb.png, description: "Десять блоков от Linux до Kubernetes, GitOps и сквозного проекта. Теория простым языком, вопросы с ответами и практика"}
